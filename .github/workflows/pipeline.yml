name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          for file in paginaComidaRapida/js/*.js; do
            node --check "$file"
          done

      - name: Validate product catalog JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('paginaComidaRapida/data/productos.json', 'utf8'))"

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=BrasaUrbana;user=sa;password=ci-only-placeholder;encrypt=true;trustServerCertificate=true"
      MIGRATION_DATABASE_URL: "sqlserver://localhost:1433;database=BrasaUrbana;user=sa;password=ci-only-placeholder;encrypt=true;trustServerCertificate=true"
      SHADOW_DATABASE_URL: "sqlserver://localhost:1433;database=BrasaUrbanaShadow;user=sa;password=ci-only-placeholder;encrypt=true;trustServerCertificate=true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: find . -path './node_modules' -prune -o -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run API and SQL Server adapter tests
        run: npm test

      - name: Audit all dependencies
        run: npm audit --audit-level=low

  security:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  deploy:
    name: Deploy frontend to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - frontend
      - backend
      - security
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: paginaComidaRapida

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
